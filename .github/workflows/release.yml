name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  # Ubuntu 20.04 便携包：容器锁定 glibc 2.31，jpackage 自带 JRE，解压即用（无需装 Java）
  portable-linux:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain prerequisites (container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip zip git binutils
          git config --global --add safe.directory '*'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable runtime (jpackage, bundled JRE)
        run: ./gradlew runtimeZip --no-daemon --console=plain

      - name: Build fat jar
        run: ./gradlew bootJar --no-daemon --console=plain -x test

      - name: Pack source zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="TextDiffJava-${VER}/" \
            -o "TextDiffJava-${VER}-source.zip" HEAD

      - name: Upload artifacts (portable zip / jar / source)
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            build/distributions/*.zip
            build/libs/*.jar
            TextDiffJava-*-source.zip

  # Windows 10 便携包：jpackage 自带 JRE，解压即用
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable runtime (jpackage, bundled JRE)
        run: .\gradlew.bat runtimeZip --no-daemon --console=plain

      - name: Upload artifacts (portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: build/distributions/*.zip

  # 发布：两平台便携包 + 裸 jar + 源码 zip 挂到 Release；Docker 镜像推 GHCR
  publish-release:
    needs: [ portable-linux, portable-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/textdiffjava:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/textdiffjava:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dist-linux/*.zip
            dist/dist-linux/*.jar
            dist/dist-linux/*-source.zip
            dist/dist-windows/*.zip
          generate_release_notes: true
