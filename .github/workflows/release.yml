name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  # 便携包矩阵：linux-x64 / linux-aarch64（原生 ARM runner）/ windows-x64
  # jpackage 自带 JRE，解压即用（无需装 Java）；Temurin JRE 仅要求 glibc ≥ 2.17，Ubuntu 20.04 可直接运行
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable runtime (jpackage, bundled JRE)
        run: ./gradlew runtimeZip --no-daemon --console=plain
        if: matrix.platform != 'windows-x64'

      - name: Build portable runtime (jpackage, bundled JRE)
        run: .\gradlew.bat runtimeZip --no-daemon --console=plain
        if: matrix.platform == 'windows-x64'

      # 裸 jar 与源码 zip 只在 linux-x64 出一份，避免矩阵并行上传重名资产
      - name: Build fat jar
        if: matrix.platform == 'linux-x64'
        run: ./gradlew bootJar --no-daemon --console=plain -x test

      # runtimeZip 产物固定为 build/image.zip，按平台改名后再上传；
      # fat jar 挪到根目录（upload-artifact 以多路径公共祖先为根，留在 build/libs 会导致发布 glob 对不上）
      - name: Collect artifacts (linux)
        if: matrix.platform != 'windows-x64'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv build/image.zip "TextDiffJava-${VER}-${{ matrix.platform }}-portable.zip"
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            mv "build/libs/TextDiffJava-${VER}.jar" "TextDiffJava-${VER}.jar"
            git archive --format=zip --prefix="TextDiffJava-${VER}/" \
              -o "TextDiffJava-${VER}-source.zip" HEAD
          fi

      - name: Collect artifacts (windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Move-Item build\image.zip "TextDiffJava-$ver-windows-x64-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            TextDiffJava-*-portable.zip
            TextDiffJava-*.jar
            TextDiffJava-*-source.zip

  # 发布：各平台便携包 + 裸 jar + 源码 zip 挂到 Release；Docker 镜像推 GHCR
  publish-release:
    needs: [ portable ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/textdiffjava:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/textdiffjava:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dist-linux-x64/*
            dist/dist-linux-aarch64/*
            dist/dist-windows/*
          generate_release_notes: true
